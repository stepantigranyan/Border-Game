<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Board game</title>
  </head>
  <body>
    <main class="h-screen flex justify-center items-center">
      <div class="w-4/5 flex gap-x-30 justify-center items-center">
        <div id="main-section" class="hidden gap-x-30 justify-center items-center">
          <div id="board-container"></div>
          <div class="flex flex-col items-center gap-y-20">
            <div class="text-xl">
              <span>Moves</span>
              <span id="moves-container">0</span>
            </div>
            <div class="text-xl">
              <span>Time</span>
              <span id="time-container">00 : 00</span>
            </div>
          </div>
        </div>
        <div id="options-section" class="flex flex-col items-center gap-y-20"></div>
        <div id="victory-section" class="hidden flex-col items-center justify-center gap-y-10">
          <h2 class="text-4xl text-red-400">Victory!</h2>
          <h4 id="spent-time-container" class="text-2xl">500</h4>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
